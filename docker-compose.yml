services:
  emusync:
    build: .
    image: emusync:latest
    container_name: emusync-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - emusync-data:/data
    environment:
      - EMUSYNC_PORT=8080
      - EMUSYNC_DATA_DIR=/data
      - EMUSYNC_AUTH_TOKEN=${EMUSYNC_AUTH_TOKEN:?EMUSYNC_AUTH_TOKEN must be set}
      - EMUSYNC_MAX_BACKUPS=${EMUSYNC_MAX_BACKUPS:-10}
      - EMUSYNC_ADVERTISE_MDNS=${EMUSYNC_ADVERTISE_MDNS:-false}
      - EMUSYNC_ADMIN_TOKEN=${EMUSYNC_ADMIN_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O", "/dev/null",
          "http://127.0.0.1:8080/api/v1/health/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  emusync-data:
    driver: local
