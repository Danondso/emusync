services:
  emusync:
    build: .
    image: emusync:latest
    container_name: emusync-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - emusync-data:/data
    environment:
      - EMUSYNC_PORT=8080
      - EMUSYNC_DATA_DIR=/data
      - EMUSYNC_AUTH_TOKEN=${EMUSYNC_AUTH_TOKEN:?EMUSYNC_AUTH_TOKEN must be set}
      - EMUSYNC_MAX_BACKUPS=10
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  emusync-data:
    driver: local
