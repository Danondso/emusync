<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>emusync admin</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 52rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; max-width: 28rem; padding: 0.35rem; }
    button { margin-top: 0.5rem; padding: 0.35rem 0.75rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow: auto; font-size: 0.85rem; }
    .row { margin: 1rem 0; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
    .err { color: #a00; }
    .ok { color: #060; }
    a { color: #06c; }
  </style>
</head>
<body>
  <h1>emusync admin</h1>
  <p>Bearer token is stored only in this browser session (<code>sessionStorage</code>). Use the same admin token as <code>EMUSYNC_ADMIN_TOKEN</code> on the server.</p>

  <label for="token">Admin Bearer token</label>
  <input id="token" type="password" autocomplete="off" placeholder="paste token"/>

  <label for="profileJson">Profile JSON (GET/PUT /admin/api/v1/profile)</label>
  <textarea id="profileJson" rows="10" style="width:100%;max-width:52rem;font-family:monospace;"></textarea>
  <button type="button" id="btnLoadProfile">Load profile</button>
  <button type="button" id="btnSaveProfile">Save profile</button>
  <span id="profileMsg"></span>

  <h2>Server status</h2>
  <button type="button" id="btnStatus">Refresh status</button>
  <pre id="statusOut">—</pre>

  <h2>Conflicts</h2>
  <p>Use <code>emusync resolve</code> from a terminal as well; this page calls the same HTTP API.</p>
  <button type="button" id="btnConflicts">Refresh conflicts</button>
  <div id="conflictsOut"></div>

  <script>
    const tokenInput = document.getElementById('token');
    tokenInput.value = sessionStorage.getItem('emusyncAdminToken') || '';

    function bearerHeaders() {
      const t = tokenInput.value.trim();
      if (!t) throw new Error('Enter admin token');
      sessionStorage.setItem('emusyncAdminToken', t);
      return { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
    }

    async function api(path, opts = {}) {
      const headers = { ...bearerHeaders(), ...(opts.headers || {}) };
      const res = await fetch(path, { ...opts, headers });
      const text = await res.text();
      let body;
      try { body = text ? JSON.parse(text) : null; } catch { body = text; }
      if (!res.ok) throw new Error(res.status + ' ' + text);
      return body;
    }

    document.getElementById('btnStatus').onclick = async () => {
      const el = document.getElementById('statusOut');
      el.textContent = 'loading…';
      try {
        const j = await api('/admin/api/v1/status');
        el.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        el.textContent = String(e);
      }
    };

    document.getElementById('btnLoadProfile').onclick = async () => {
      const msg = document.getElementById('profileMsg');
      msg.textContent = '';
      try {
        const j = await api('/admin/api/v1/profile');
        document.getElementById('profileJson').value = JSON.stringify(j, null, 2);
        msg.textContent = 'Loaded.';
        msg.className = 'ok';
      } catch (e) {
        msg.textContent = String(e);
        msg.className = 'err';
      }
    };

    document.getElementById('btnSaveProfile').onclick = async () => {
      const msg = document.getElementById('profileMsg');
      msg.textContent = '';
      let doc;
      try {
        doc = JSON.parse(document.getElementById('profileJson').value);
      } catch (e) {
        msg.textContent = 'Invalid JSON: ' + e;
        msg.className = 'err';
        return;
      }
      try {
        await api('/admin/api/v1/profile', { method: 'PUT', body: JSON.stringify(doc) });
        msg.textContent = 'Saved.';
        msg.className = 'ok';
      } catch (e) {
        msg.textContent = String(e);
        msg.className = 'err';
      }
    };

    function conflictCard(c) {
      const div = document.createElement('div');
      div.className = 'row';

      const title = document.createElement('strong');
      title.textContent = c.id ?? '';
      div.appendChild(title);

      const nl1 = document.createElement('br');
      div.appendChild(nl1);
      const emuLine = document.createElement('span');
      emuLine.textContent = 'emulator: ' + (c.emulator ?? '');
      div.appendChild(emuLine);

      div.appendChild(document.createElement('br'));
      const pathLine = document.createElement('span');
      pathLine.textContent = 'path: ' + (c.path ?? '');
      div.appendChild(pathLine);

      div.appendChild(document.createElement('br'));
      const acts = [
        ['local', 'Keep local'],
        ['remote', 'Keep remote'],
        ['keep-both', 'Keep both'],
      ];
      for (const [act, label] of acts) {
        const btn = document.createElement('button');
        btn.setAttribute('data-act', act);
        btn.textContent = label;
        btn.onclick = async () => {
          const choice = btn.getAttribute('data-act');
          try {
            await api('/admin/api/v1/conflicts/' + encodeURIComponent(c.id) + '/resolve', {
              method: 'POST',
              body: JSON.stringify({ choice }),
            });
            btn.parentElement.remove();
          } catch (e) {
            alert(String(e));
          }
        };
        div.appendChild(btn);
        div.appendChild(document.createTextNode(' '));
      }
      return div;
    }

    document.getElementById('btnConflicts').onclick = async () => {
      const root = document.getElementById('conflictsOut');
      root.textContent = 'loading…';
      try {
        const j = await api('/admin/api/v1/conflicts');
        root.textContent = '';
        const list = (j.conflicts || []);
        if (!list.length) {
          root.textContent = 'No unresolved conflicts.';
          return;
        }
        list.forEach(c => root.appendChild(conflictCard(c)));
      } catch (e) {
        root.textContent = '';
        const p = document.createElement('p');
        p.className = 'err';
        p.textContent = String(e);
        root.appendChild(p);
      }
    };
  </script>
</body>
</html>
